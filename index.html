```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111111;
            min-height: 100vh;
        }

        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
        }

        .error-content {
            max-width: 650px;
            width: 100%;
        }

        .error-code {
            font-size: clamp(120px, 20vw, 220px);
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -12px;
            color: #b00000;
            margin-bottom: 30px;
        }

        .error-title {
            font-size: clamp(28px, 5vw, 46px);
            font-weight: 800;
            margin-bottom: 15px;
        }

        .error-description {
            color: #666;
            font-size: 17px;
            line-height: 1.7;
            max-width: 500px;
            margin: 0 auto 35px;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 180px;
            padding: 14px 28px;
            border-radius: 8px;
            background: #b00000;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            transition: 0.25s ease;
        }

        .home-btn:hover {
            background: #8f0000;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(176, 0, 0, 0.18);
        }

        .back-btn {
            display: inline-block;
            margin-top: 18px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .back-btn:hover {
            color: #b00000;
        }

        @media (max-width: 600px) {
            .error-page {
                padding: 20px;
            }

            .error-code {
                letter-spacing: -6px;
                margin-bottom: 25px;
            }

            .error-description {
                font-size: 15px;
            }

            .home-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="error-page">

        <div class="error-content">

            <div class="error-code">
                404
            </div>

            <h1 class="error-title">
                Page Not Found
            </h1>

            <p class="error-description">
                Sorry, the page you're looking for doesn't exist or may have been moved.
            </p>

            <a href="/" class="home-btn">
                Back to Home
            </a>

            <br>

            <a href="javascript:history.back()" class="back-btn">
                ← Go Back
            </a>

        </div>

    </main>

</body>
</html>
```
